<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>中学教务管理系统可运行示例</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <p>CODE runnable example</p>
          <h1>中学教务管理系统</h1>
        </div>
        <select id="roleSelect">
          <option value="academic_admin">教务管理员</option>
          <option value="head_teacher">班主任</option>
          <option value="teacher">任课教师</option>
        </select>
      </header>

      <section class="card">
        <h2>当前菜单</h2>
        <div id="menus" class="menus"></div>
      </section>

      <section class="grid">
        <article class="card">
          <h2>学生管理</h2>
          <button id="duplicateStudentButton">尝试新增重复学号</button>
          <pre id="studentResult"></pre>
          <table>
            <thead>
              <tr><th>学号</th><th>姓名</th><th>班级</th><th>状态</th></tr>
            </thead>
            <tbody id="studentRows"></tbody>
          </table>
        </article>

        <article class="card">
          <h2>成绩管理</h2>
          <button id="invalidScoreButton">尝试录入 101 分</button>
          <pre id="scoreResult"></pre>
          <table>
            <thead>
              <tr><th>学生</th><th>班级</th><th>课程</th><th>成绩</th></tr>
            </thead>
            <tbody id="scoreRows"></tbody>
          </table>
        </article>
      </section>
    </main>

    <script src="./main.js"></script>
  </body>
</html>
